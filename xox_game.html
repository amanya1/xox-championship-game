<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XOX Game (XOX Scoring)</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Removed overflow-hidden to ensure full visibility and allow scrolling if necessary */
            height: 100%; 
        }
        /* Style for the grid to ensure cells are square */
        #game-board {
            display: grid;
            grid-template-columns: repeat(var(--grid-size, 3), minmax(0, 1fr));
            grid-template-rows: repeat(var(--grid-size, 3), minmax(0, 1fr));
            aspect-ratio: 1 / 1;
        }
        /* Cell text colors */
        .text-x { color: #3b82f6; } /* blue-500 */
        .text-o { color: #ef4444; } /* red-500 */
        
        /* Highlight for scoring cells (XOX) */
        .highlight {
            background-color: #fde047; /* yellow-300 */
            transform: scale(1.05);
            transition: all 0.3s ease-in-out;
        }

        /* Custom radio button styles for setup */
        .setup-radio:checked + label {
            background-color: #facc15; /* yellow-400 */
            color: #1f2937; /* gray-800 */
            border-color: #facc15; /* yellow-400 */
            transform: scale(1.05);
        }
        .setup-label {
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        /* Modal styles */
        .modal {
            display: none; /* Hidden by default, JS sets to flex */
            position: fixed;
            z-index: 50;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <!-- Game Setup Screen (Modal) -->
    <div id="setup-screen" class="modal flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md mx-auto text-center animate-slideIn">
            <h2 class="text-3xl font-bold text-gray-800 mb-6">Game Setup</h2>
            
            <!-- Grid Size Selector -->
            <div class="mb-8">
                <label class="block text-xl font-medium text-gray-700 mb-3">Grid Size:</label>
                <div class="flex justify-center rounded-lg shadow-sm">
                    <input type="radio" id="size-3x3" name="grid-size" value="3" class="sr-only setup-radio" checked>
                    <label for="size-3x3" class="setup-label w-1/2 text-center rounded-l-lg border border-gray-300 p-4 font-bold text-2xl">
                        3 x 3
                    </label>
                    <input type="radio" id="size-4x4" name="grid-size" value="4" class="sr-only setup-radio">
                    <label for="size-4x4" class="setup-label w-1/2 text-center rounded-r-lg border-t border-b border-r border-gray-300 p-4 font-bold text-2xl">
                        4 x 4
                    </label>
                </div>
            </div>

            <!-- Game Mode Selector -->
            <div class="mb-8">
                <label class="block text-xl font-medium text-gray-700 mb-3">Game Mode:</label>
                <div class="flex justify-center rounded-lg shadow-sm">
                    <input type="radio" id="mode-single" name="game-mode" value="single" class="sr-only setup-radio" checked>
                    <label for="mode-single" class="setup-label w-1/2 text-center rounded-l-lg border border-gray-300 p-4 font-bold text-xl">
                        Single Game
                    </label>
                    <input type="radio" id="mode-tournament" name="game-mode" value="tournament" class="sr-only setup-radio">
                    <label for="mode-tournament" class="setup-label w-1/2 text-center rounded-r-lg border-t border-b border-r border-gray-300 p-4 font-bold text-xl">
                        Tournament
                        <span class="block text-xs font-normal">(Best of 3)</span>
                    </label>
                </div>
            </div>

            <button id="start-game-btn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-4 rounded-lg text-2xl shadow-lg transition duration-300 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
                Start Game
            </button>
        </div>
    </div>

    <!-- Game Over & Dare Modal -->
    <div id="game-over-modal" class="modal items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg mx-auto text-center">
            <h2 id="congrats-message" class="text-4xl font-black text-indigo-600 mb-4">Congratulations!</h2>
            <p id="winner-text" class="text-2xl font-medium text-gray-700 mb-6">Player X wins!</p>
            
            <div id="dare-container" class="bg-gray-100 p-6 rounded-lg mb-6">
                <p id="loser-text" class="text-xl font-bold text-red-600 mb-4">Player O, you have a dare!</p>
                
                <button id="show-dare-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg text-xl shadow-md transition duration-300">
                    Show My Dare
                </button>
                
                <div id="dare-text-container" class="hidden">
                    <p class="text-lg font-medium text-gray-700 mb-2">Your Dare Is:</p>
                    <p id="dare-text" class="text-2xl font-bold text-gray-900"></p>
                </div>
            </div>

            <button id="new-game-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg text-xl shadow-md transition duration-300">
                Play Again
            </button>
        </div>
    </div>

    <!-- Main Game Screen -->
    <div id="game-screen" class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-md mx-auto hidden">
        
        <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-800 mb-4">
            XOX Scoring Game
        </h1>

        <!-- Tournament Info -->
        <div id="tournament-info" class="hidden text-center mb-4">
            <div id="tournament-score-display" class="text-xl font-bold text-indigo-700">
                Tournament: X (0) - O (0)
            </div>
            <div id="current-round-display" class="text-lg font-medium text-gray-600">
                Round 1 of 3
            </div>
        </div>

        <!-- Scoreboard and Turn Indicator -->
        <div class="flex justify-between items-center mb-4">
            <div id="playerX-score" class="text-lg font-semibold text-blue-600 p-3 rounded-lg bg-blue-50 border border-blue-200 transition-all duration-300">
                X Points: 0
            </div>
            <div id="playerO-score" class="text-lg font-semibold text-red-600 p-3 rounded-lg bg-red-50 border border-red-200 transition-all duration-300">
                O Points: 0
            </div>
        </div>
        <div id="turn-indicator" class="text-center text-2xl font-bold text-gray-700 mb-6">
            Player X's Turn
        </div>

        <!-- Game Board -->
        <div id="game-board" class="w-full bg-gray-200 rounded-lg shadow-inner overflow-hidden mb-6" style="--grid-size: 3;">
            <!-- Cells will be generated by JavaScript -->
        </div>

        <!-- Message Area -->
        <div id="message-area" class="text-center text-xl font-bold text-green-600 h-8 mb-4"></div>

        <!-- In-Game Buttons -->
        <div class="flex space-x-4">
             <button id="restart-round-btn" class="w-1/2 bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-4 rounded-lg text-lg shadow-md transition duration-300">
                Restart Round
            </button>
            <button id="quit-to-menu-btn" class="w-1/2 bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-lg text-lg shadow-md transition duration-300">
                Quit to Menu
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Dares List ---
            const dares = [
                "Hold hands with the person next to you for 1 minute.",
                "Call your best friend and say 'I like you!' (as a friend, of course!).",
                "Do 10 push-ups.",
                "Do 10 jumping jacks.",
                "Sing 'Twinkle Twinkle Little Star' out loud.",
                "Talk in a funny accent for the next 5 minutes.",
                "Let the winner draw a mustache on your face with a (non-permanent) pen.",
                "Balance a spoon on your nose for 30 seconds.",
                "Try to lick your elbow.",
                "Make 10 push-ups."
            ];

            // --- DOM Elements ---
            const setupScreen = document.getElementById('setup-screen');
            const gameScreen = document.getElementById('game-screen');
            const gameOverModal = document.getElementById('game-over-modal');
            const startGameBtn = document.getElementById('start-game-btn');
            
            const boardElement = document.getElementById('game-board');
            const pXScoreElement = document.getElementById('playerX-score');
            const pOScoreElement = document.getElementById('playerO-score');
            const turnIndicator = document.getElementById('turn-indicator');
            const messageArea = document.getElementById('message-area');
            
            const tournamentInfo = document.getElementById('tournament-info');
            const tournamentScoreDisplay = document.getElementById('tournament-score-display');
            const currentRoundDisplay = document.getElementById('current-round-display');

            const restartRoundBtn = document.getElementById('restart-round-btn');
            const quitToMenuBtn = document.getElementById('quit-to-menu-btn');

            const congratsMessage = document.getElementById('congrats-message');
            const winnerText = document.getElementById('winner-text'); 
            const loserText = document.getElementById('loser-text');
            const dareContainer = document.getElementById('dare-container');
            const showDareBtn = document.getElementById('show-dare-btn');
            const dareTextContainer = document.getElementById('dare-text-container');
            const dareText = document.getElementById('dare-text');
            const newGameBtn = document.getElementById('new-game-btn');

            // --- Game State ---
            let board = [];
            let gridSize = 3;
            let gameMode = 'single'; // 'single' or 'tournament'
            let currentPlayer = 'X';
            let scores = { X: 0, O: 0 }; // Tracks points in the current round
            let tournamentScores = { X: 0, O: 0 }; // Tracks round wins for the tournament
            let currentRound = 1;
            let isGameOver = false;
            let cellsFilled = 0;
            const winCondition = () => gridSize;
            let winningCells = null; 

            // --- Game Flow ---

            function showSetupScreen() {
                setupScreen.style.display = 'flex';
                gameScreen.style.display = 'none';
                gameOverModal.style.display = 'none';
                document.getElementById('size-3x3').checked = true;
                document.getElementById('mode-single').checked = true;
            }

            function startGame() {
                gridSize = parseInt(document.querySelector('input[name="grid-size"]:checked').value);
                gameMode = document.querySelector('input[name="game-mode"]:checked').value;

                tournamentScores = { X: 0, O: 0 };
                currentRound = 1;
                
                if (gameMode === 'tournament') {
                    tournamentInfo.style.display = 'block';
                    updateTournamentScoreDisplay();
                    updateRoundDisplay();
                    restartRoundBtn.textContent = 'Restart Round';
                } else {
                    tournamentInfo.style.display = 'none';
                    restartRoundBtn.textContent = 'Restart Game';
                }

                setupScreen.style.display = 'none';
                gameScreen.style.display = 'block';
                gameOverModal.style.display = 'none';

                startNewRound();
            }

            function startNewRound() {
                board = Array(gridSize).fill(null).map(() => Array(gridSize).fill(''));
                boardElement.innerHTML = '';
                boardElement.style.setProperty('--grid-size', gridSize);
                isGameOver = false;
                cellsFilled = 0;
                currentPlayer = 'X';
                messageArea.textContent = '';
                scores = { X: 0, O: 0 }; // Reset points for new round
                
                // Clear highlights from scoreboards
                pXScoreElement.classList.remove('scale-110', 'bg-blue-100');
                pOScoreElement.classList.remove('scale-110', 'bg-red-100');
                document.querySelectorAll('.highlight').forEach(cell => cell.classList.remove('highlight'));


                updateTurnIndicator();
                updateGameScoreDisplay(); 

                // Create cells
                const cellSizeClass = gridSize === 3 ? 'text-8xl' : 'text-6xl';
                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        const cell = document.createElement('div');
                        cell.classList.add('border', 'border-gray-300', 'flex', 'items-center', 'justify-center', 'font-black', 'cursor-pointer', 'hover:bg-gray-50', 'transition-colors', cellSizeClass);
                        cell.dataset.r = r;
                        cell.dataset.c = c;
                        boardElement.appendChild(cell);
                    }
                }
            }
            
            // --- UI Updates ---
            function updateGameScoreDisplay() {
                pXScoreElement.textContent = `X Points: ${scores.X}`;
                pOScoreElement.textContent = `O Points: ${scores.O}`;
            }

            function updateTournamentScoreDisplay() {
                tournamentScoreDisplay.textContent = `Tournament: X (${tournamentScores.X}) - O (${tournamentScores.O})`;
            }

            function updateRoundDisplay() {
                currentRoundDisplay.textContent = `Round ${currentRound} of 3`;
            }

            function updateTurnIndicator() {
                if (currentPlayer === 'X') {
                    turnIndicator.textContent = "Player X's Turn";
                    turnIndicator.style.color = '#2563eb'; // blue-600
                    pXScoreElement.classList.add('scale-110', 'bg-blue-100');
                    pOScoreElement.classList.remove('scale-110', 'bg-red-100');
                } else {
                    turnIndicator.textContent = "Player O's Turn";
                    turnIndicator.style.color = '#dc2626'; // red-600
                    pOScoreElement.classList.add('scale-110', 'bg-red-100');
                    pXScoreElement.classList.remove('scale-110', 'bg-blue-100');
                }
            }

            // --- Game Logic ---
            
            // Function to switch the current player
            function switchTurn() {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateTurnIndicator();
            }

            /**
             * Checks for the EXACT pattern X O X, awarding the point to the player whose move (r, c) completed it.
             * - If currentPiece is 'X', it scores if it completes [X O X] as the first or third X.
             * - If currentPiece is 'O', it scores if it completes [X O X] as the middle O.
             */
            function checkScore(r, c) {
                let points = 0;
                const currentPiece = board[r][c];

                // Check only 4 unique directions (Horizontal, Vertical, 2 Diagonals)
                const uniqueDirections = [
                    { dr: 0, dc: 1 },  
                    { dr: 1, dc: 0 },  
                    { dr: 1, dc: 1 },  
                    { dr: 1, dc: -1 }  
                ];

                const isValid = (pr, pc) => pr >= 0 && pr < gridSize && pc >= 0 && pc < gridSize;
                
                for (const { dr, dc } of uniqueDirections) {
                    
                    // 1. Check segment starting one step BEFORE the placed piece (r-dr, c-dc)
                    // Pattern: [P1] [P2] [P3] where P3 is the placed piece (r, c)
                    // Checks: [X] [O] [Placed X]
                    const r1 = r - 2 * dr; 
                    const c1 = c - 2 * dc;
                    const r2 = r - dr; 
                    const c2 = c - dc;
                    
                    if (isValid(r1, c1) && isValid(r2, c2)) {
                        if (board[r1][c1] === 'X' && board[r2][c2] === 'O' && currentPiece === 'X') {
                            points++;
                            highlightCell(r, c);
                            highlightCell(r2, c2);
                            highlightCell(r1, c1);
                        }
                    }
                    
                    // 2. Check segment centered on the placed piece (r, c)
                    // Pattern: [P1] [P2] [P3] where P2 is the placed piece (r, c)
                    // Checks: [X] [Placed O] [X]
                    const r_back = r - dr; 
                    const c_back = c - dc;
                    const r_fwd = r + dr; 
                    const c_fwd = c + dc; 

                    if (isValid(r_back, c_back) && isValid(r_fwd, c_fwd)) {
                        if (board[r_back][c_back] === 'X' && currentPiece === 'O' && board[r_fwd][c_fwd] === 'X') {
                            points++;
                            highlightCell(r, c);
                            highlightCell(r_back, c_back);
                            highlightCell(r_fwd, c_fwd);
                        }
                    }

                    // 3. Check segment starting at the placed piece (r, c)
                    // Pattern: [P1] [P2] [P3] where P1 is the placed piece (r, c)
                    // Checks: [Placed X] [O] [X]
                    const r2_fwd = r + dr;
                    const c2_fwd = c + dc;
                    const r3_fwd = r + 2 * dr;
                    const c3_fwd = c + 2 * dc;

                    if (isValid(r2_fwd, c2_fwd) && isValid(r3_fwd, c3_fwd)) {
                        if (currentPiece === 'X' && board[r2_fwd][c2_fwd] === 'O' && board[r3_fwd][c3_fwd] === 'X') {
                            points++;
                            highlightCell(r, c);
                            highlightCell(r2_fwd, c2_fwd);
                            highlightCell(r3_fwd, c3_fwd);
                        }
                    }
                }
                return points;
            }

            function highlightCell(r, c) {
                const cell = document.querySelector(`[data-r='${r}'][data-c='${c}']`);
                if (cell) {
                    cell.classList.add('highlight');
                }
            }


            // Called when the game ends (board is full)
            function handleGameEnd() {
                isGameOver = true;
                
                // Determine winner of the round based on points
                let roundWinner;
                if (scores.X > scores.O) {
                    roundWinner = 'X';
                } else if (scores.O > scores.X) {
                    roundWinner = 'O';
                } else {
                    roundWinner = 'draw';
                }

                if (roundWinner === 'draw') {
                    messageArea.textContent = `It's a Draw! (X: ${scores.X}, O: ${scores.O})`;
                    messageArea.style.color = '#52525b'; 
                } else {
                    messageArea.textContent = `Player ${roundWinner} wins the round!`;
                    messageArea.style.color = (roundWinner === 'X' ? '#16a34a' : '#dc2626');
                }

                if (gameMode === 'tournament') {
                    if (roundWinner !== 'draw') {
                        tournamentScores[roundWinner]++; // Increment round win count
                    }
                    updateTournamentScoreDisplay();
                    
                    // Check for tournament win or advance
                    if (tournamentScores.X === 2 || tournamentScores.O === 2) {
                        setTimeout(() => handleTournamentEnd(tournamentScores.X === 2 ? 'X' : 'O'), 2000);
                    } else if (currentRound < 3) {
                        currentRound++;
                        setTimeout(() => {
                            updateRoundDisplay();
                            startNewRound();
                        }, 2000);
                    } else {
                         // Final round played, determine winner if tie on 1-1
                         setTimeout(() => handleTournamentEnd(roundWinner), 2000);
                    }
                } else {
                    // Single game win
                    setTimeout(() => {
                        if (roundWinner === 'draw') {
                            showFinalDrawModal();
                        } else {
                            showDareModal(roundWinner, false);
                        }
                    }, 2000);
                }
            }

            function handleTournamentEnd(finalWinner) {
                // Determine tournament winner based on best of 3 or final round winner
                if (finalWinner === 'draw') {
                    congratsMessage.textContent = "Tournament Draw!";
                    winnerText.textContent = "The series ended in a tie!";
                    dareContainer.style.display = 'none'; // No dares on a draw
                } else {
                    showDareModal(finalWinner, true);
                }
            }

            function showFinalDrawModal() {
                congratsMessage.textContent = "Game Over: Draw!";
                winnerText.textContent = `The board is full. Final Score: X (${scores.X}) - O (${scores.O}).`;
                dareContainer.style.display = 'none';
                gameOverModal.style.display = 'flex';
            }
            
            function showDareModal(winner, isTournamentWin) {
                const loser = winner === 'X' ? 'O' : 'X';
                
                if (isTournamentWin) {
                    congratsMessage.textContent = "Tournament Champion!";
                    winnerText.textContent = `Player ${winner} won the series with ${tournamentScores[winner]} rounds!`;
                } else {
                    congratsMessage.textContent = "Congratulations!";
                    winnerText.textContent = `Player ${winner} won the round with ${scores[winner]} points!`;
                }
                
                loserText.textContent = `Player ${loser}, you have a dare!`;
                
                // Reset dare UI
                dareContainer.style.display = 'block';
                showDareBtn.style.display = 'block';
                dareTextContainer.style.display = 'none';

                gameOverModal.style.display = 'flex';
            }

            function showDare() {
                const randomDare = dares[Math.floor(Math.random() * dares.length)];
                dareText.textContent = randomDare;
                showDareBtn.style.display = 'none';
                dareTextContainer.style.display = 'block';
            }
            
            // --- Event Handlers ---
            startGameBtn.addEventListener('click', startGame);
            boardElement.addEventListener('click', handleCellClick);
            restartRoundBtn.addEventListener('click', () => {
                startNewRound();
            });
            quitToMenuBtn.addEventListener('click', showSetupScreen);
            showDareBtn.addEventListener('click', showDare);
            newGameBtn.addEventListener('click', () => {
                gameOverModal.style.display = 'none';
                showSetupScreen();
            });


            function handleCellClick(e) {
                if (isGameOver || !e.target.dataset.r) return;

                const r = parseInt(e.target.dataset.r);
                const c = parseInt(e.target.dataset.c);

                if (board[r][c] !== '') return; // Cell already filled

                // Place the letter
                board[r][c] = currentPlayer;
                e.target.textContent = currentPlayer;
                e.target.classList.add(currentPlayer === 'X' ? 'text-x' : 'text-o');
                e.target.classList.remove('hover:bg-gray-50');
                e.target.style.cursor = 'default';
                cellsFilled++;
                
                // 1. Check for score
                const pointsScored = checkScore(r, c);
                
                if (pointsScored > 0) {
                    scores[currentPlayer] += pointsScored;
                    updateGameScoreDisplay();
                    
                    const scoreMessage = `Player ${currentPlayer} scored ${pointsScored} point(s)!`;
                    messageArea.textContent = scoreMessage;
                    messageArea.style.color = (currentPlayer === 'X' ? '#16a34a' : '#dc2626');
                } else {
                    messageArea.textContent = '';
                }

                // 2. Check for game over
                if (cellsFilled === gridSize * gridSize) {
                    handleGameEnd(); 
                } else {
                    // 3. Continue game, switch turn
                    switchTurn();
                }
            }


            // --- Initial Game Start ---
            showSetupScreen();
        });
    </script>

</body>
</html>
